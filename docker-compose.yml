services:
  backend:
    build: ./backend
    environment:
      # Ollama on the host machine. Change it if Ollama runs somewhere else.
      AGENTLAB_OLLAMA_URL: ${AGENTLAB_OLLAMA_URL:-http://host.docker.internal:11434}
      AGENTLAB_LLAMACPP_URL: ${AGENTLAB_LLAMACPP_URL:-http://host.docker.internal:8080/v1}
      AGENTLAB_NIM_API_KEY: ${AGENTLAB_NIM_API_KEY:-}
      AGENTLAB_OPENAI_API_KEY: ${AGENTLAB_OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agentlab-db:/db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Optional: run Ollama in Docker instead of on the host.
  #   docker compose --profile ollama up --build
  #   set AGENTLAB_OLLAMA_URL=http://ollama:11434 in your environment
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  agentlab-db:
  ollama-models:
