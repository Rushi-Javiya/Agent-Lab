name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and API tests
        run: pytest
      - name: Evaluation gate (baseline agent must stay good)
        run: python -m app.cli --db sqlite:// eval --version 1 --min-score 0.9 --min-pass-rate 0.9
      - name: Evaluation gate catches a weak agent
        run: |
          if python -m app.cli --db sqlite:// eval --version 2 --min-score 0.9; then
            echo "The gate should have failed for the weak model" && exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
