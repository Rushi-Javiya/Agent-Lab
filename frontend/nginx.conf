server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin for the UI and the API, so no CORS setup is needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Evaluations and extraction call a model and can take a while.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
